.login-root{min-height:100vh;background:#0b1530;color:white;display:grid;grid-template-columns:minmax(0,1.03fr) minmax(460px,.97fr);overflow:hidden}.login-story{padding:60px clamp(32px,7vw,108px);display:flex;flex-direction:column;justify-content:space-between;position:relative;background:radial-gradient(ellipse at 10% 10%,#253d7b 0%,transparent 44%),linear-gradient(136deg,#102047,#101b37 65%,#0b1530)}.login-story:after{content:'';position:absolute;left:-12%;bottom:-38%;width:640px;height:640px;border:1px solid #ffffff19;border-radius:50%;box-shadow:0 0 0 90px #ffffff07,0 0 0 190px #ffffff04}.login-big{font:800 clamp(43px,5vw,76px)/1.14 Manrope,sans-serif;letter-spacing:-4px;max-width:690px;position:relative;z-index:1}.login-big em{font-style:normal;color:#9ba9ff}.login-story p{color:#a8b9d9;font-size:14px;line-height:1.9;max-width:460px;position:relative;z-index:1}.login-orbit{width:200px;height:200px;border-radius:38px;background:linear-gradient(140deg,#6b7fff44,#ffffff09);border:1px solid #ffffff2e;display:grid;place-items:center;transform:rotate(-12deg);box-shadow:25px 35px 80px #070e25;position:relative;z-index:1}.login-panel{background:#f8faff;color:#1a2946;display:flex;align-items:center;justify-content:center;padding:35px}.login-card{width:100%;max-width:425px}.login-card h2{font:800 34px Manrope,sans-serif;letter-spacing:-1.6px;margin:8px 0}.demo-card{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid #e4eaf4;background:#fff;border-radius:13px;margin-bottom:9px;text-align:left;width:100%}.demo-card:hover{border-color:#aab6ff;background:#f7f8ff}.login-foot{font-size:10px;color:#9ba7b9;margin-top:22px;line-height:1.8}.info-box{background:#f2f5ff;border:1px solid #e2e8ff;padding:13px 15px;border-radius:12px;color:#6473ab;font-size:11px}.checkbox-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.checkbox-item{display:flex;align-items:center;gap:7px;padding:8px 9px;border:1px solid #ebeff6;bord <body>
<!-- SOURCE OF TRUTH (DEMO CONTRACT) and fixture generator are defined at the START of the JavaScript below. -->
<div id="app"><div style="display:grid;place-items:center;min-height:100vh;font-family:Inter,sans-serif;color:#7786a2">Загрузка интерфейса TOU Campus…</div></div>

<template id="app-template">
<!-- AUTHENTICATION -->
<div v-if="!session" class="login-root">
 <section class="login-story">
  <div class="flex items-center gap-3 relative z-10"><div class="brand-mark"><Icon name="graduation" :size="23"></Icon></div><div><div class="text-lg font-extrabold tracking-tight">TOU Campus</div><div class="text-[10px] text-slate-400 uppercase tracking-[.18em]">University experience</div></div></div>
  <div class="relative z-10"><span class="chip"><span class="dot text-emerald-300"></span>Университет в едином пространстве</span><h1 class="login-big">Учёба.<br>Данные.<br><em>Всё на месте.</em></h1><p class="mt-7">Расписание, успеваемость, посещаемость и академическая аналитика — одна понятная система для студентов, преподавателей и администрации.</p></div>
  <div class="flex items-center justify-between gap-5 relative z-10"><div class="text-[11px] text-slate-400">TOU Campus · Демонстрационная версия<br>© {{ new Date().getFullYear() }} Toraighyrov University</div><div class="login-orbit"><Icon name="graduation" :size="90" style="transform:rotate(12deg);color:#cad2ff"></Icon></div></div>
 </section>
 <section class="login-panel"><div class="login-card">
  <div class="eyebrow">Добро пожаловать</div><h2>Войти в систему</h2><p class="subtle text-xs mb-8">Выберите тестовую роль или введите учётные данные.</p>
  <form @submit.prevent="login" class="space-y-4">
   <div><label class="field-label">Электронная почта</label><div class="relative"><input class="field !py-[14px]" autocomplete="username" type="email" v-model.trim="loginForm.email" placeholder="name@tou.kz" required></div></div>
   <div><label class="field-label">Пароль</label><div class="relative"><input class="field !py-[14px]" :type="showPassword?'text':'password'" autocomplete="current-password" v-model="loginForm.password" placeholder="Введите пароль" required><button type="button" @click="showPassword=!showPassword" class="absolute right-3 top-[12px] text-slate-400"><Icon :name="showPassword?'eye-off':'eye'" :size="18"></Icon></button></div></div>
   <div class="inline-error" v-if="loginError">{{loginError}}</div>
   <button class="btn btn-primary w-full !min-h-[48px] !text-[13px]" type="submit">Продолжить <Icon name="arrow-right" :size="17"></Icon></button>
  </form>
  <div class="flex items-center gap-3 my-7"><div class="soft-divider"></div><span class="text-[10px] font-bold text-slate-400 whitespace-nowrap">БЫСТРЫЙ ДЕМО-ВХОД</span><div class="soft-divider"></div></div>
  <button v-for="u in demoAccounts" :key="u.id" class="demo-card" @click="quickLogin(u)"><div class="flex items-center gap-3"><div class="initials" :class="roleClass(u.role)">{{initials(u.name)}}</div><div><div class="font-bold text-xs">{{roleName(u.role)}}</div><div class="text-[10px] text-slate-400">{{u.email}}</div></div></div><Icon name="arrow-up-right" :size="16" class="text-slate-400"></Icon></button>
  <div class="login-foot"><Icon name="shield" :size="13" class="mr-1"></Icon> Только браузерный прототип. Пароли демонстрационные, доступ не защищён сервером. Данные хранятся локально на этом устройстве.</div>
 </div></section>
</div>

<!-- APP -->
<div v-else class="app-shell">
 <aside class="sidebar">
  <div class="brand"><div class="brand-mark"><Icon name="graduation" :size="22"></Icon></div><div><div class="brand-name">TOU Campus</div><div class="brand-caption">ACADEMIC PLATFORM</div></div></div>
  <div class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</div>
  <template v-for="item in navigation" :key="item.key"><button class="nav-item" :class="{active:page===item.key}" @click="navigate(item.key)" :title="item.label"><Icon :name="item.icon" :size="18"></Icon><span>{{item.label}}</span></button></template>
  <template v-if="isAdmin"><div class="nav-caption mt-4">АДМИНИСТРИРОВАНИЕ</div><button v-for="item in adminNavigation" :key="item.key" class="nav-item" :class="{active:page===item.key}" @click="navigate(item.key)" :title="item.label"><Icon :name="item.icon" :size="18"></Icon><span>{{item.label}}</span></button></template>
  <div class="sidebar-user"><div class="flex items-center gap-3"><div class="initials">{{initials(currentUser.name)}}</div><div class="min-w-0"><div class="font-bold text-xs truncate">{{currentUser.name}}</div><div class="subtle text-[10px]">{{roleName(currentUser.role)}}</div></div></div><button class="mt-3 w-full text-left text-[11px] text-slate-400 hover:text-red-500 flex items-center gap-2" @click="logout"><Icon name="log-out" :size="14"></Icon>Выйти</button></div>
 </aside>
 <div class="main-column">
  <header class="topbar"><div class="top-search"><Icon name="search" :size="18"></Icon><span>Единое рабочее пространство / <strong class="text-slate-600 font-semibold">{{currentPageLabel}}</strong></span></div><div class="top-actions"><span class="clock">{{todayLong}}</span><span class="pill pill-green"><span class="dot"></span>Локальная база</span><button class="round-icon" @click="navigate('profile')" title="Мой профиль"><Icon name="settings" :size="18"></Icon></button><div class="initials" :title="currentUser.name">{{initials(currentUser.name)}}</div></div></header>
  <main class="content"><transition name="slide" mode="out-in"><div :key="page" class="page-layout">

<!-- DASHBOARD -->
<template v-if="page==='dashboard'">
 <div><div class="eyebrow">Панель управления</div><h1 class="page-title">Обзор академического пространства</h1><p class="page-subtitle">{{todayLong}} · Актуальные показатели на основе записей в системе</p></div>
 <div class="hero"><div class="relative z-10"><span class="chip"><Icon name="sparkles" :size="13"></Icon> {{roleName(currentUser.role)}} · {{activeSemester?.name || 'Семестр не выбран'}}</span><div class="hero-title">{{greeting}}, {{firstName(currentUser.name)}}!</div><p class="hero-desc">{{dashboardGreeting}} Данные обновляются сразу после ваших изменений.</p><button class="btn !mt-5 !bg-white !text-indigo-700" @click="navigate('schedule')">Моё расписание <Icon name="arrow-up-right" :size="15"></Icon></button></div><div class="hero-art"><div class="hero-glow"><Icon name="graduation" :size="70"></Icon></div></div></div>
 <div class="grid-4"><div v-for="s in dashboardCards" :key="s.label" class="surface stat-card"><div class="flex justify-between items-center"><div class="stat-icon"><Icon :name="s.icon" :size="18"></Icon></div><span class="pill" :class="s.tone">{{s.note}}</span></div><div class="metric">{{s.value}}</div><div class="text-xs font-semibold text-slate-600">{{s.label}}</div></div></div>
 <div class="grid-2">
  <section class="surface p-6"><div class="flex items-start justify-between"><div><div class="eyebrow">Учебная аналитика</div><h2 class="section-title mt-1">Средний балл по дисциплинам</h2></div><div class="pill pill-blue">0–100</div></div><div v-if="subjectChart.length" class="chart-bars"><div v-for="c in subjectChart" :key="c.id" class="chart-col"><div class="text-[10px] font-extrabold text-slate-500">{{c.value}}</div><div class="chart-bars-slot"><div class="chart-bar" :title="c.name+': '+c.value" :style="{height:(c.value || 0)+'%'}"></div></div><div class="chart-label truncate max-w-full" :title="c.name">{{c.short}}</div></div></div><div v-else class="blank">Пока нет выставленных оценок для построения диаграммы.</div></section>
  <section class="surface p-6"><div class="eyebrow">Показатели посещаемости</div><h2 class="section-title mt-1">Структура посещений</h2><div class="flex items-center justify-center gap-8 min-h-[230px] flex-wrap"><div class="donut" :style="{background:attendanceGradient}"><div class="donut-value">{{attendancePct}}%<div class="text-[10px] font-semibold text-slate-400">присутствовали</div></div></div><div class="space-y-3"><div v-for="v in attendanceLegend" :key="v.status" class="text-[11px] font-semibold text-slate-500 flex items-center"><span class="legend-dot" :style="{background:v.color}"></span>{{v.label}} <strong class="ml-3 text-slate-800">{{v.count}}</strong></div></div></div></section>
 </div>
 <section class="surface p-6"><div class="flex items-center justify-between gap-4"><div><div class="eyebrow">Сегодня · {{todayShort}}</div><h2 class="section-title mt-1">Ближайшие занятия</h2></div><button class="btn btn-outline btn-sm" @click="navigate('schedule')">Всё расписание <Icon name="arrow-right" :size="13"></Icon></button></div><div v-if="todayLessons.length" class="grid grid-cols-1 xl:grid-cols-2 gap-x-10 mt-4"><div class="today-item" v-for="l in todayLessons" :key="l.id"><div class="timebox">{{l.start}}<div class="text-[9px] text-slate-400">{{l.end}}</div></div><div class="min-w-0 flex-1"><div class="font-bold text-xs">{{subjectName(l.subjectId)}}</div><div class="text-[10px] text-slate-400">{{groupName(l.groupId)}} · {{teacherName(l.teacherId)}} · {{roomName(l.roomId)}}</div></div><span class="pill pill-blue">{{l.topic || 'Занятие'}}</span></div></div><div v-else class="blank"><div class="blank-icon"><Icon name="calendar" :size="24"></Icon></div>На сегодня занятий нет.</div></section>
</template>

<!-- STUDENTS/TEACHERS/GROUPS/SUBJECTS/ROOMS/SEMESTERS/USERS -->
<template v-else-if="entityPages.includes(page)">
 <div class="page-header"><div><div class="eyebrow">{{entityMeta[page].caption}}</div><h1 class="page-title">{{entityMeta[page].title}}</h1><p class="page-subtitle">{{entityMeta[page].description}}</p></div><button v-if="canCreate(page)" class="btn btn-primary" @click="openForm(page)"><Icon name="plus" :size="16"></Icon> {{entityMeta[page].add}}</button></div>
 <div v-if="page==='students' && isStudent" class="info-box"><Icon name="shield" :size="15"></Icon> Вы видите только свою карточку. Доступ к персональным данным других студентов запрещён.</div>
 <section class="surface overflow-hidden"><div class="toolbar"><div class="toolbar-filters"><div class="relative"><Icon name="search" :size="15" class="absolute left-3 top-[11px] text-slate-400"></Icon><input class="field search !pl-9" v-model="filters[page].search" placeholder="Поиск по записям…"/></div><select v-if="page==='students'||page==='groups'" class="field" v-model="filters[page].extra"><option value="">Все группы / курсы</option><option v-for="g in visibleGroups" :value="g.id" :key="g.id">{{g.name}}</option></select><select v-else-if="page==='teachers'" class="field" v-model="filters[page].extra"><option value="">Все дисциплины</option><option v-for="s in visibleSubjects" :value="s.id" :key="s.id">{{s.name}}</option></select><select v-else-if="page==='users'" class="field" v-model="filters[page].extra"><option value="">Все роли</option><option value="ADMIN">Администратор</option><option value="TEACHER">Преподаватель</option><option value="STUDENT">Студент</option></select></div><div class="subtle text-[11px]">Записей: <strong class="text-slate-700">{{entityFiltered(page).length}}</strong></div></div>
 <div class="table-wrap"><table class="data-table"><thead><tr><th v-for="c in entityMeta[page].columns" :key="c.key" :class="{sortable:c.sort}" @click="c.sort&&sortEntity(page,c.key)">{{c.label}} <span v-if="sorts[page].key===c.key">{{sorts[page].dir===1?'↑':'↓'}}</span></th><th style="text-align:right">Действия</th></tr></thead><tbody><tr v-for="row in pagedEntities(page)" :key="row.id"><td v-for="c in entityMeta[page].columns" :key="c.key"><div v-if="c.key==='name' || c.key==='fullName'" class="flex gap-3 items-center"><div class="initials" :class="roleClass(row.role||'')">{{initials(row.name||fullName(row))}}</div><div><div class="font-bold text-slate-700">{{cellValue(page,row,c.key)}}</div><div class="text-[10px] text-slate-400" v-if="page==='students'">{{row.studentNo}}</div><div class="text-[10px] text-slate-400" v-else-if="page==='teachers'">{{row.department}}</div></div></div><span v-else-if="c.key==='role'" class="pill pill-blue">{{roleName(row.role)}}</span><span v-else-if="c.key==='status'" class="pill" :class="row.status==='active'?'pill-green':'pill-amber'">{{row.status==='active'?'Активен':'Архив'}}</span><span v-else>{{cellValue(page,row,c.key)}}</span></td><td class="!text-right whitespace-nowrap"><button class="action-link" @click="openDetail(page,row)"><Icon name="eye" :size="14"></Icon>Карточка</button><button v-if="canEdit(page,row)" class="action-link" @click="openForm(page,row)"><Icon name="edit" :size="14"></Icon>Правка</button><button v-if="canDelete(page,row)" class="action-link danger-link" @click="confirmDelete(page,row)"><Icon name="trash" :size="14"></Icon></button></td></tr></tbody></table></div><div v-if="entityFiltered(page).length===0" class="blank"><div class="blank-icon"><Icon name="search" :size="21"></Icon></div>Записей по заданным условиям не найдено.</div><div class="page-footer"><span>Показано {{pagedEntities(page).length}} из {{entityFiltered(page).length}}</span><div class="page-numbers"><button @click="changeEntityPage(page,-1)" :disabled="filters[page].page<=1">‹</button><button class="active">{{filters[page].page}}</button><button @click="changeEntityPage(page,1)" :disabled="filters[page].page>=Math.ceil(entityFiltered(page).length/8)">›</button></div></div></section>
</template>

<!-- SCHEDULE -->
<template v-else-if="page==='schedule'">
 <div class="page-header"><div><div class="eyebrow">Управление академическим временем</div><h1 class="page-title">Расписание занятий</h1><p class="page-subtitle">Конфликты преподавателя, группы и аудитории проверяются при сохранении.</p></div><button v-if="isAdmin" class="btn btn-primary" @click="openForm('lessons')"><Icon name="plus" :size="16"></Icon> Новое занятие</button></div>
 <section class="surface p-5"><div class="flex items-center justify-between gap-3 flex-wrap"><div class="flex items-center gap-3"><button class="btn btn-outline btn-icon" @click="shiftWeek(-1)"><Icon name="chevron-left" :size="17"></Icon></button><div class="font-bold text-sm min-w-[155px] text-center">{{weekLabel}}</div><button class="btn btn-outline btn-icon" @click="shiftWeek(1)"><Icon name="chevron-right" :size="17"></Icon></button><button class="btn btn-soft btn-sm" @click="resetWeek">Сегодня</button></div><div class="flex gap-2 items-center"><select class="field !w-auto !text-xs" v-if="isAdmin" v-model="scheduleGroup"><option value="">Все группы</option><option v-for="g in db.groups" :value="g.id" :key="g.id">{{g.name}}</option></select><div class="seg-tabs"><button class="seg-tab" :class="{active:scheduleMode==='calendar'}" @click="scheduleMode='calendar'"><Icon name="calendar" :size="14"></Icon> Календарь</button><button class="seg-tab" :class="{active:scheduleMode==='table'}" @click="scheduleMode='table'"><Icon name="list" :size="14"></Icon> Таблица</button></div></div></div></section>
 <div v-if="scheduleMode==='calendar'" class="calendar-grid"><div v-for="d in weekDays" :key="d.iso" class="calendar-day" :class="{today:d.iso===todayISO}"><div class="flex justify-between items-center"><span class="text-[10px] font-bold text-slate-400">{{d.dayName}}</span><span class="text-sm font-bold" :class="d.iso===todayISO?'text-indigo-600':'text-slate-700'">{{d.day}}</span></div><div v-for="l in weekLessonsFor(d.iso)" :key="l.id" class="calendar-event" :class="{conflict:!!findConflict(l,l.id)}" @click="openDetail('lessons',l)"><div class="font-bold">{{l.start}}–{{l.end}}</div><div class="font-semibold mt-1">{{subjectName(l.subjectId)}}</div><div class="text-[9px] opacity-70 mt-1">{{groupName(l.groupId)}} · {{roomName(l.roomId)}}</div></div></div></div>
 <section v-else class="surface overflow-hidden"><div class="table-wrap"><table class="data-table"><thead><tr><th>Дата</th><th>Время</th><th>Дисциплина</th><th>Группа</th><th>Преподаватель</th><th>Аудитория</th><th class="text-right">Действия</th></tr></thead><tbody><tr v-for="l in scheduledWeekLessons" :key="l.id"><td>{{dateDisplay(l.date)}}</td><td>{{l.start}}–{{l.end}}</td><td class="font-bold">{{subjectName(l.subjectId)}}</td><td>{{groupName(l.groupId)}}</td><td>{{teacherName(l.teacherId)}}</td><td>{{roomName(l.roomId)}}</td><td class="text-right"><button class="action-link" @click="openDetail('lessons',l)">Открыть</button><button v-if="isAdmin" class="action-link" @click="openForm('lessons',l)">Правка</button><button v-if="isAdmin" class="action-link danger-link" @click="confirmDelete('lessons',l)">Удалить</button></td></tr></tbody></table></div><div v-if="!scheduledWeekLessons.length" class="blank">Занятий в выбранной неделе нет.</div></section>
 <div v-if="scheduleMode==='calendar'" class="flex items-center gap-3 text-[11px] text-slate-400"><span class="dot text-indigo-500"></span>Занятие <span class="dot text-rose-500"></span>Обнаружен конфликт в сохранённых данных (например, после импорта)</div>
</template>

<!-- ATTENDANCE -->
<template v-else-if="page==='attendance'">
 <div class="page-header"><div><div class="eyebrow">Учебная дисциплина</div><h1 class="page-title">Посещаемость</h1><p class="page-subtitle">Учёт каждого студента по конкретному занятию, без ручного ввода статистики.</p></div><span class="pill pill-green"><Icon name="check-circle" :size="14"></Icon> {{attendancePct}}% посещений</span></div>
 <section class="surface p-5"><div class="flex gap-3 items-end flex-wrap"><div class="flex-1 min-w-[220px]"><label class="field-label">Выберите занятие</label><select class="field" v-model="attendanceLessonId"><option value="">Выберите занятие</option><option v-for="l in visibleLessonsSorted" :value="l.id" :key="l.id">{{dateDisplay(l.date)}} · {{l.start}} · {{subjectName(l.subjectId)}} · {{groupName(l.groupId)}}</option></select></div><div v-if="selectedAttendanceLesson" class="pill pill-blue">{{roomName(selectedAttendanceLesson.roomId)}} · {{teacherName(selectedAttendanceLesson.teacherId)}}</div><button v-if="canMarkAttendance && selectedAttendanceLesson" class="btn btn-soft" @click="markAllPresent"><Icon name="check-check" :size="15"></Icon> Отметить присутствующих</button></div></section>
 <section v-if="selectedAttendanceLesson" class="surface overflow-hidden"><div class="toolbar"><div><h2 class="section-title">Ведомость посещаемости</h2><p class="subtle text-[11px] mt-1">{{groupName(selectedAttendanceLesson.groupId)}} · {{subjectName(selectedAttendanceLesson.subjectId)}} · {{dateDisplay(selectedAttendanceLesson.date)}}</p></div><span class="pill">{{attendanceRoster.length}} студентов</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Студент</th><th>Группа</th><th>Статус</th><th>Зафиксировано</th></tr></thead><tbody><tr v-for="s in attendanceRoster" :key="s.id"><td><div class="flex items-center gap-3"><div class="initials">{{initials(fullName(s))}}</div><b>{{fullName(s)}}</b></div></td><td>{{groupName(s.groupId)}}</td><td><select class="attendance-select" :class="attendanceFor(s.id,selectedAttendanceLesson.id)?.status||''" :disabled="!canMarkAttendance" :value="attendanceFor(s.id,selectedAttendanceLesson.id)?.status||''" @change="setAttendance(s.id,selectedAttendanceLesson.id,$event.target.value)"><option value="">Не отмечен</option><option value="present">Присутствовал</option><option value="absent">Отсутствовал</option><option value="late">Опоздал</option><option value="excused">Уважительная</option></select></td><td class="subtle">{{attendanceFor(s.id,selectedAttendanceLesson.id)?.updatedAt ? dateTimeDisplay(attendanceFor(s.id,selectedAttendanceLesson.id).updatedAt) : '—'}}</td></tr></tbody></table></div><div v-if="!attendanceRoster.length" class="blank">Студенты этой группы не найдены.</div></section><div v-else class="surface blank"><div class="blank-icon"><Icon name="clipboard" :size="24"></Icon></div>Выберите занятие для просмотра и отметки посещаемости.</div>
</template>

<!-- GRADES -->
<template v-else-if="page==='grades'">
 <div class="page-header"><div><div class="eyebrow">Академическая успеваемость</div><h1 class="page-title">Оценки и ведомости</h1><p class="page-subtitle">Оценивание по шкале 0–100. Среднее — арифметическое по всем оценкам.</p></div><span class="pill pill-blue">Средний балл: {{displayAvg(visibleGrades)}}</span></div>
 <section class="surface p-5"><div class="flex gap-3 items-end flex-wrap"><div class="flex-1 min-w-[225px]"><label class="field-label">Занятие / дисциплина</label><select class="field" v-model="gradeLessonId"><option value="">Все оценки</option><option v-for="l in visibleLessonsSorted" :value="l.id" :key="l.id">{{dateDisplay(l.date)}} · {{subjectName(l.subjectId)}} · {{groupName(l.groupId)}}</option></select></div><div v-if="canGrade && gradeLessonId"><label class="field-label">Вид оценивания</label><select v-model="gradeType" class="field"><option>Текущая</option><option>Рубежная</option><option>Итоговая</option></select></div><div class="pill pill-green">{{selectedGradeRows.length}} записей</div></div></section>
 <section class="surface overflow-hidden"><div class="toolbar"><div><h2 class="section-title">{{gradeLessonId?'Оценки занятия':'Журнал оценок'}}</h2><div class="subtle text-[11px] mt-1">{{gradeLessonId?'Для быстрого ввода выберите тип и измените значение в строке':'Оценки в пределах вашей роли и доступных дисциплин'}}</div></div><div v-if="gradeLessonId&&canGrade" class="text-[10px] text-slate-400">Enter / фокус вне поля — сохранить</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Студент</th><th>Дисциплина</th><th>Дата</th><th>Тип</th><th>Балл</th><th class="text-right">Действия</th></tr></thead><tbody>
  <template v-if="gradeLessonId && canGrade"><tr v-for="s in gradeRoster" :key="s.id"><td><div class="font-bold">{{fullName(s)}}</div><div class="text-[10px] text-slate-400">{{s.studentNo}}</div></td><td>{{subjectName(selectedGradeLesson.subjectId)}}</td><td>{{dateDisplay(selectedGradeLesson.date)}}</td><td>{{gradeType}}</td><td><input type="number" min="0" max="100" step="1" class="grade-input" :key="s.id+'-'+gradeLessonId+'-'+gradeType" :value="gradeFor(s.id,gradeLessonId,gradeType)?.value??''" placeholder="—" @change="saveGradeFromInput(s.id,gradeLessonId,gradeType,$event)" @keydown.enter="$event.target.blur()"/></td><td class="text-right"><button v-if="gradeFor(s.id,gradeLessonId,gradeType)" class="action-link danger-link" @click="confirmDelete('grades',gradeFor(s.id,gradeLessonId,gradeType))">Удалить</button></td></tr></template>
  <template v-else><tr v-for="g in selectedGradeRows.slice(0,gradeRowLimit)" :key="g.id"><td class="font-bold">{{studentName(g.studentId)}}</td><td>{{subjectName(lesson(g.lessonId)?.subjectId)}}</td><td>{{dateDisplay(lesson(g.lessonId)?.date)}}</td><td>{{g.type}}</td><td><span class="pill" :class="g.value>=75?'pill-green':g.value>=50?'pill-amber':'pill-red'">{{g.value}} / 100</span></td><td class="text-right"><button v-if="canEdit('grades',g)" class="action-link" @click="openForm('grades',g)">Правка</button><button v-if="canDelete('grades',g)" class="action-link danger-link" @click="confirmDelete('grades',g)">Удалить</button></td></tr></template>
 </tbody></table></div><div v-if="!selectedGradeRows.length && !(gradeLessonId&&canGrade&&gradeRoster.length)" class="blank">Оценок пока нет.</div><div v-if="!gradeLessonId&&selectedGradeRows.length>gradeRowLimit" class="page-footer"><span>Показано {{gradeRowLimit}} из {{selectedGradeRows.length}}</span><button class="btn btn-outline btn-sm" @click="gradeRowLimit+=25">Показать ещё</button></div></section>
</template>

<!-- REPORTS -->
<template v-else-if="page==='reports'">
 <div><div class="eyebrow">Документы и выгрузки</div><h1 class="page-title">Академические отчёты</h1><p class="page-subtitle">Экспорт в настоящие файлы XLSX и DOCX. Содержимое создаётся из текущих записей.</p></div>

<script>
/* ===========================================================================
  TOU CAMPUS — SINGLE-FILE DEMO. INPUT / OUTPUT CONTRACT (SOURCE OF TRUTH)
  INPUT: current user + form operations + canonical entity arrays.
  OUTPUT: permitted views, CRUD changes, validations, audit, XLSX, DOCX, JSON.
  THIS IS A FRONT-END SIMULATION. NO JAVA SERVER, DATABASE, JUNIT OR LOG4J.
=========================================================================== */
const DEMO_CONTRACT = Object.freeze({
 version: 3,
 input: {
  auth: { email: 'string', password: 'string' },
  mutation: { entity: 'students|teachers|groups|subjects|rooms|semesters|users|lessons|grades|attendance', action: 'create|update|delete', payload: 'object', actorId: 'user.id' },
  state: { users: 'User[]', students: 'Student[]', teachers: 'Teacher[]', groups: 'Group[]', subjects: 'Subject[]', lessons: 'Lesson[]', attendance: 'Attendance[]', grades: 'Grade[]', semesters: 'Semester[]', rooms: 'Room[]', audit: 'AuditEvent[]' }
 },
 output: { mutation: '{ok:boolean, error?:string, saved?:object}', dashboard: 'KPI and charts derived ONLY from role-filtered state', excel: '.xlsx Office Open XML', certificate: '.docx Office Open XML', persistence: 'localStorage' },
 model: {
  User: 'id, name, email unique, password [DEMO ONLY], role ADMIN|TEACHER|STUDENT, entityId?',
  Student: 'id, studentNo unique, firstName, lastName, email unique, groupId -> Group, phone?',
  Teacher: 'id, name, email unique, department, subjectIds[] -> Subject (N:M)',
  Group: 'id, name unique, year, curatorId -> Teacher, subjectIds[] -> Subject (N:M)',
  Subject: 'id, code unique, name, credits',
  Lesson: 'id, date, start, end, groupId, subjectId, teacherId, roomId, semesterId, topic',
  Attendance: 'id, studentId, lessonId UNIQUE together, status present|absent|late|excused, updatedAt',
  Grade: 'id, studentId, lessonId, type, value 0..100, updatedAt UNIQUE (studentId, lessonId, type)',
  Semester: 'id, name unique, start, end, status active|archived',
  Room: 'id, name unique, capacity positive, building'
 },
 decisions: {
  grading: 'integer 0–100; arithmetic mean of all saved marks with equal weight, 1 decimal; empty -> —',
  attendance: 'present + late count as attended; excused / absent do not count, denominator = recorded statuses only',
  schedule: 'concrete date + overlapping [start,end) ranges; group, teacher OR room clashes rejected; room >= group student count',
  integrity: 'restrict delete when referenced; no automatic cascading; cannot delete own logged-in account',
  authorization: 'roles enforced in browser UI and every mutation path; teacher owns lessons; student sees own grades/attendance',
  audit: 'actor/time/entity/action/details + capped local event history; not tamper-resistant',
  persistence: 'browser-local; no backend or network. local password check is for UX demonstration, not security.',
  reportScope: 'role-filtered records, optionally group and semester',
  terms: 'the currently selected active semester determines initial context; archived semester cannot receive new lessons'
 }
});
window.DEMO_CONTRACT = DEMO_CONTRACT;
const STORAGE_KEY = 'tou-campus-demo-v3';
const SESSION_KEY = 'tou-campus-session-v3';
const DAY_NAMES = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const STATUS_NAMES = { present:'Присутствовал', absent:'Отсутствовал', late:'Опоздал', excused:'Уважительная' };
const ROLE_NAMES = {ADMIN:'Администратор',TEACHER:'Преподаватель',STUDENT:'Студент'};
const MODELS = ['users','students','teachers','groups','subjects','lessons','attendance','grades','semesters','rooms'];
const pad = n => String(n).padStart(2,'0');
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const plusDays = (d,n) => {const o=new Date(d.getFullYear(),d.getMonth(),d.getDate());o.setDate(o.getDate()+n);return o};
const dateOf = s => new Date(`${s}T12:00:00`);
const uid = prefix => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const escXML = v => String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
const mean = arr => arr.length ? arr.reduce((sum,n)=>sum+Number(n),0)/arr.length : null;
const rangeOverlap = (a,b,c,d) => a<d && c<b;
function detectConflict(candidate, existing, ignoreId) {
 return existing.find(l => l.id!==ignoreId && l.date===candidate.date && rangeOverlap(l.start,l.end,candidate.start,candidate.end) && (
  l.teacherId===candidate.teacherId || l.roomId===candidate.roomId || l.groupId===candidate.groupId
 )) || null;
}
function createSeed() {
 const now = new Date(), y=now.getFullYear(), fall=now.getMonth()>=7;
 const current = fall ? {start:`${y}-08-01`,end:`${y}-12-31`,name:`Осенний ${y}/${y+1}`} : {start:`${y}-01-01`,end:`${y}-07-31`,name:`Весенний ${y-1}/${y}`};
 const other = fall ? {start:`${y+1}-01-01`,end:`${y+1}-07-31`,name:`Весенний ${y}/${y+1}`} : {start:`${y}-08-01`,end:`${y}-12-31`,name:`Осенний ${y}/${y+1}`};
 const subjects = [
 ['Программирование','CS101',5],['Базы данных','CS204',5],['Математический анализ','MA101',4],['Английский язык','EN102',3],
 ['Алгоритмы и структуры данных','CS202',5],['Компьютерные сети','CS303',4],['Экономика','EC101',3],['Информационная безопасность','CS404',4]
 ].map((s,i)=>({id:'su'+(i+1),name:s[0],code:s[1],credits:s[2]}));
 const teachers = [
 ['Алия Нурланова','Информационные технологии',['su1','su2']],['Марат Омаров','Информационные технологии',['su3','su4']],
 ['Динара Ахметова','Компьютерные науки',['su5','su6']],['Ерлан Садыков','Экономика',['su7','su8']],
 ['Сания Бекенова','Компьютерные науки',['su1','su5']],['Арман Калиев','Математика',['su2','su6']]
 ].map((t,i)=>({id:'t'+(i+1),name:t[0],email:`lecturer${i+1}@tou.kz`,department:t[1],subjectIds:t[2]}));
 const groups = [
 ['CS-401',4,'t1',['su1','su2','su3','su5']],['IS-402',4,'t2',['su1','su3','su4','su7']],
 ['CS-301',3,'t3',['su2','su4','su6','su8']],['SE-201',2,'t4',['su1','su5','su6','su8']]
 ].map((g,i)=>({id:'g'+(i+1),name:g[0],year:g[1],curatorId:g[2],subjectIds:g[3]}));
 const rooms = [ ['A-301',26,'Корпус A'],['B-204',30,'Корпус B'],['Lab-105',20,'IT-корпус'],['A-112',24,'Корпус A'],['B-306',18,'Корпус B'],['Lab-209',30,'IT-корпус'] ].map((r,i)=>({id:'r'+(i+1),name:r[0],capacity:r[1],building:r[2]}));
 const names = [
 ['Александр','Иванов'],['Мария','Петрова'],['Айгерим','Тлеуберген'],['Данияр','Ермеков'],['София','Ким'],['Нурсултан','Ахметов'],
 ['Алина','Серикова'],['Максим','Волков'],['Аружан','Омарова'],['Тимур','Садыков'],['Диана','Ганиева'],['Арсен','Муратов'],
 ['Анастасия','Кузнецова'],['Алихан','Досанов'],['Виктория','Соколова'],['Ерасыл','Есенов'],['Мадина','Касымова'],['Павел','Громов'],
 ['Эльмира','Муратова'],['Руслан','Турсынов'],['Аида','Султанова'],['Дамир','Исмаилов'],['Полина','Орлова'],['Ильяс','Абдрахманов']
 ];
 const students = names.map((n,i)=>({id:'st'+(i+1),studentNo:'S'+String(y).slice(-2)+String(1001+i),firstName:n[0],lastName:n[1],email:`student${i+1}@tou.kz`,groupId:'g'+(Math.floor(i/6)+1),phone:'+7 700 '+String(1000000+i).slice(0,3)+' '+String(1000000+i).slice(3)}));
 const users = [
 {id:'u_admin',name:'Администратор TOU',email:'admin@tou.kz',password:'Admin123!',role:'ADMIN',entityId:''},
 {id:'u_teacher',name:teachers[0].name,email:'teacher@tou.kz',password:'Teacher123!',role:'TEACHER',entityId:'t1'},
 {id:'u_student',name:'Александр Иванов',email:'student@tou.kz',password:'Student123!',role:'STUDENT',entityId:'st1'}
 ];
 const semesters = [{id:'sem1',...current,status:'active'},{id:'sem2',...other,status:'active'}];
 const lessons=[],attendance=[],grades=[];
 const slots=[['09:00','10:30'],['11:00','12:30'],['14:00','15:30']];
 // Real dates distributed over several weeks. No hardcoded dashboard counters.
 for(let offset=-18;offset<=9;offset++){
  const date=plusDays(now,offset),dow=date.getDay();if(dow===0)continue;
  const iso=localISO(date),semester=semesters.find(s=>iso>=s.start&&iso<=s.end);if(!semester)continue;
  for(let slot=0;slot<3;slot++){
   const group=groups[(offset+200+slot)%groups.length];
   const subjectId=group.subjectIds[(Math.floor((offset+200)/3)+slot)%group.subjectIds.length];

   function requiredTrim(x){return typeof x==='string'?x.trim():x}
   function validateEntity(kind,v,originalId){
    const arr=db[kind],other=field=>arr.some(r=>r.id!==originalId&&String(r[field]).toLocaleLowerCase('ru-RU')===String(v[field]).toLocaleLowerCase('ru-RU'));
    const required=(...fields)=>fields.every(k=>v[k]!==''&&v[k]!=null&&String(v[k]).trim()!=='');
    const emailOK=x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(x||''));
    const exactRef=(table,id)=>db[table].some(r=>r.id===id);
    const unique=(field,msg)=>other(field)?msg:null;
    if(kind==='students'){
     if(!required('firstName','lastName','studentNo','email','groupId'))return 'Заполните обязательные поля студента.';
     if(!emailOK(v.email))return 'Укажите корректный email студента.';
     if(!exactRef('groups',v.groupId))return 'Выберите существующую группу.';
     if(unique('studentNo','Номер студента уже занят.'))return 'Номер студента уже занят.';
     if(other('email'))return 'Эта почта уже указана у другого студента.';
     const groupSize=db.students.filter(s=>s.groupId===v.groupId&&s.id!==originalId).length+1;
     if(db.lessons.some(l=>l.groupId===v.groupId&&(db.rooms.find(r=>r.id===l.roomId)?.capacity||0)<groupSize))return 'Вместимость одной из назначенных группе аудиторий меньше нового состава.';
    }
    else if(kind==='teachers'){
     if(!required('name','email','department'))return 'Укажите ФИО, почту и кафедру.';
     if(!emailOK(v.email)||other('email'))return 'Email преподавателя неверный или уже используется.';
     if(!Array.isArray(v.subjectIds)||!v.subjectIds.length||v.subjectIds.some(id=>!exactRef('subjects',id)))return 'Преподавателю нужна минимум одна существующая дисциплина.';
     if(db.lessons.some(l=>l.teacherId===originalId&&!v.subjectIds.includes(l.subjectId)))return 'Нельзя убрать дисциплину, пока преподаватель ведёт по ней занятия.';
    }
    else if(kind==='groups'){
     if(!required('name','year','curatorId'))return 'Укажите название группы, курс и куратора.';
     if(other('name'))return 'Группа с таким названием уже существует.';
     if(!Number.isInteger(Number(v.year))||v.year<1||v.year>6)return 'Курс должен быть целым числом от 1 до 6.';
     if(!exactRef('teachers',v.curatorId))return 'Выберите существующего куратора.';
     if(!Array.isArray(v.subjectIds)||!v.subjectIds.length||v.subjectIds.some(id=>!exactRef('subjects',id)))return 'Выберите существующие дисциплины группы.';
     if(db.lessons.some(l=>l.groupId===originalId&&!v.subjectIds.includes(l.subjectId)))return 'Нельзя убрать дисциплину, по которой уже есть занятия.';
    }
    else if(kind==='subjects'){
     if(!required('name','code','credits'))return 'Заполните название, код и кредиты дисциплины.';
     if(other('code'))return 'Код дисциплины уже используется.';
     if(!Number.isInteger(Number(v.credits))||v.credits<1||v.credits>30)return 'Количество кредитов должно быть от 1 до 30.';
    }
    else if(kind==='rooms'){
     if(!required('name','building','capacity'))return 'Заполните название, корпус и вместимость.';
     if(other('name'))return 'Аудитория с таким именем уже существует.';
     if(!Number.isInteger(Number(v.capacity))||v.capacity<1||v.capacity>1000)return 'Вместимость должна быть целым числом от 1 до 1000.';
     if(db.lessons.some(l=>l.roomId===originalId&&db.students.filter(s=>s.groupId===l.groupId).length>Number(v.capacity)))return 'Вместимость меньше численности уже назначенной группы.';
    }
    else if(kind==='semesters'){
     if(!required('name','start','end','status'))return 'Заполните данные семестра.';
     if(other('name'))return 'Семестр с таким названием уже существует.';
     if(v.start>v.end)return 'Дата окончания должна быть позже даты начала.';
     if(!['active','archived'].includes(v.status))return 'Недопустимый статус семестра.';
     if(db.semesters.some(s=>s.id!==originalId&&rangeOverlap(v.start,v.end+'~',s.start,s.end+'~')))return 'Даты семестра пересекаются с другим семестром.';
     if(db.lessons.some(l=>l.semesterId===originalId&&(l.date<v.start||l.date>v.end)))return 'Границы семестра не должны исключать существующие занятия.';
    }
    else if(kind==='users'){
     if(!required('name','email','role'))return 'Укажите имя, почту и роль.';
     if(!originalId&&!required('password'))return 'Укажите пароль для новой учётной записи.';
     if(!emailOK(v.email)||other('email'))return 'Логин неверный или занят.';
     if(!ROLE_NAMES[v.role])return 'Недопустимая роль.';
     if(v.password&&v.password.length<6)return 'Для демо пароль должен содержать минимум 6 символов.';
     if(originalId===currentUser.value?.id&&v.role!=='ADMIN')return 'Нельзя менять собственную административную роль.';
     if(v.role==='STUDENT'&&!exactRef('students',v.entityId))return 'Для студента нужна связанная карточка Student.';
     if(v.role==='TEACHER'&&!exactRef('teachers',v.entityId))return 'Для преподавателя нужна связанная карточка Teacher.';
     if(v.role==='ADMIN')v.entityId='';
     if(v.role!=='ADMIN'&&db.users.some(u=>u.id!==originalId&&u.role===v.role&&u.entityId===v.entityId))return 'Эта карточка уже привязана к другой учётной записи.';
    }
    else if(kind==='lessons'){
     if(!required('date','start','end','semesterId','groupId','subjectId','teacherId','roomId'))return 'Заполните дату, время, семестр, группу, предмет, преподавателя и аудиторию.';
     if(!/^\d{4}-\d\d-\d\d$/.test(v.date))return 'Неверная дата занятия.';
     if(!/^\d\d:\d\d$/.test(v.start)||!/^\d\d:\d\d$/.test(v.end)||v.start>=v.end)return 'Конец занятия должен быть позже начала.';
     const sem=db.semesters.find(s=>s.id===v.semesterId),group=db.groups.find(g=>g.id===v.groupId),t=db.teachers.find(t=>t.id===v.teacherId),r=db.rooms.find(r=>r.id===v.roomId);
     if(!sem||!group||!t||!r||!exactRef('subjects',v.subjectId))return 'Все связанные объекты должны существовать.';
     if(sem.status!=='active')return 'Нельзя назначить занятие в архивный семестр.';
     if(v.date<sem.start||v.date>sem.end)return 'Дата занятия находится вне выбранного семестра.';
     if(!group.subjectIds.includes(v.subjectId))return 'Дисциплина отсутствует в учебном плане группы.';
     if(!t.subjectIds.includes(v.subjectId))return 'Преподаватель не закреплён за дисциплиной.';
     if(db.students.filter(s=>s.groupId===group.id).length>r.capacity)return 'Аудитория меньше численности группы.';
     const conflict=detectConflict(v,db.lessons,originalId);
     if(conflict){const cause=conflict.teacherId===v.teacherId?'преподавателя':conflict.roomId===v.roomId?'аудитории':'группы';return `Конфликт расписания ${cause}: ${subjectName(conflict.subjectId)}, ${conflict.start}–${conflict.end}.`}
     if(originalId&&db.grades.some(g=>g.lessonId===originalId)||originalId&&db.attendance.some(a=>a.lessonId===originalId)){
      const prev=lesson(originalId);if(prev&&prev.groupId!==v.groupId)return 'Нельзя менять группу занятия, если у него уже есть оценки или посещаемость.';
     }
    }
    else if(kind==='grades'){
     if(!required('studentId','lessonId','type','value'))return 'Выберите студента, занятие, вид оценивания и балл.';
     if(!['Текущая','Рубежная','Итоговая'].includes(v.type))return 'Неверный тип оценки.';
     if(!Number.isInteger(Number(v.value))||Number(v.value)<0||Number(v.value)>100)return 'Оценка должна быть целым числом 0–100.';
     const l=lesson(v.lessonId),s=db.students.find(s=>s.id===v.studentId);
     if(!l||!s||s.groupId!==l.groupId)return 'Студент не принадлежит группе занятия.';
     if(isTeacher.value&&l.teacherId!==userEntityId.value)return 'Это занятие другого преподавателя.';
     if(db.grades.some(g=>g.id!==originalId&&g.studentId===v.studentId&&g.lessonId===v.lessonId&&g.type===v.type))return 'Такая оценка уже есть — отредактируйте существующую.';
    }
    return null;
   }
   function saveForm(){const kind=modal.kind,originalId=modal.id;
    if(!(originalId?canEdit(kind,db[kind].find(r=>r.id===originalId)):canCreate(kind))){modal.error='Недостаточно прав для сохранения.';return}
    let v=JSON.parse(JSON.stringify(modal.form));for(const [key,value] of Object.entries(v))if(typeof value==='string')v[key]=requiredTrim(value);
    if(['students','teachers','users'].includes(kind))v.email=String(v.email||'').toLowerCase();
    if(kind==='users'&&originalId&&!v.password)v.password=db.users.find(x=>x.id===originalId)?.password||'';
    if(kind==='lessons'&&v.topic!=null)v.topic=String(v.topic).slice(0,110);
    const err=validateEntity(kind,v,originalId);if(err){modal.error=err;return}
    const numeric={groups:['year'],subjects:['credits'],rooms:['capacity'],grades:['value']};for(const k of numeric[kind]||[])v[k]=Number(v[k]);
    if(originalId){const index=db[kind].findIndex(r=>r.id===originalId);if(index<0){modal.error='Запись не найдена.';return}v.id=originalId;if(kind==='grades')v.updatedAt=new Date().toISOString();db[kind].splice(index,1,v)}
    else{v.id=uid(kind.slice(0,3));if(kind==='grades')v.updatedAt=new Date().toISOString();db[kind].push(v)}
    audit(originalId?'UPDATE':'CREATE',kind,`${kind} / ${v.name||v.studentNo||v.code||v.id}`);modal.open=false;toast(originalId?'Изменения сохранены':'Запись добавлена');if(filters[kind])filters[kind].page=1
   }

   function deleteBlocker(kind,id){switch(kind){
    case 'students':if(db.grades.some(g=>g.studentId===id)||db.attendance.some(a=>a.studentId===id))return 'Есть оценки или посещаемость: удаление запрещено. Сначала удалите связанные ведомости.';if(db.users.some(u=>u.entityId===id&&u.role==='STUDENT'))return 'К студенту привязана учётная запись — сначала удалите или перепривяжите её.';break;
    case 'teachers':if(db.lessons.some(l=>l.teacherId===id)||db.groups.some(g=>g.curatorId===id))return 'Преподаватель связан с занятиями или курируемыми группами.';if(db.users.some(u=>u.entityId===id&&u.role==='TEACHER'))return 'К преподавателю привязана учётная запись.';break;
    case 'groups':if(db.students.some(s=>s.groupId===id)||db.lessons.some(l=>l.groupId===id))return 'Группа содержит студентов или занятия.';break;
    case 'subjects':if(db.lessons.some(l=>l.subjectId===id)||db.teachers.some(t=>t.subjectIds.includes(id))||db.groups.some(g=>g.subjectIds.includes(id)))return 'Дисциплина привязана к группе, преподавателю или занятию.';break;
    case 'rooms':if(db.lessons.some(l=>l.roomId===id))return 'Аудитория уже используется в расписании.';break;
    case 'semesters':if(db.lessons.some(l=>l.semesterId===id))return 'Семестр содержит занятия.';break;
    case 'lessons':if(db.grades.some(g=>g.lessonId===id)||db.attendance.some(a=>a.lessonId===id))return 'У занятия есть оценки или записи посещаемости.';break;
    case 'users':if(currentUser.value?.id===id)return 'Нельзя удалить текущую учётную запись.';break;
   }return null}

   function confirmDelete(kind,row){if(!canDelete(kind,row)){toast('Нет прав на удаление','error');return}
    const title=`Удалить ${kind==='grades'?'оценку':kind==='lessons'?'занятие':'запись'}?`,message=`Действие необратимо. Объект: ${row.name||row.studentNo||row.id}. Если есть связанные данные, удаление будет заблокировано.`;
    confirmAction(title,message,()=>{if(!canDelete(kind,row)){confirmation.error='Нет прав на удаление';return}const blocker=deleteBlocker(kind,row.id);if(blocker){confirmation.error=blocker;toast(blocker,'error');return}const idx=db[kind].findIndex(x=>x.id===row.id);if(idx<0){confirmation.error='Запись уже удалена';return}db[kind].splice(idx,1);audit('DELETE',kind,`Удаление ${row.name||row.studentNo||row.id}`);confirmation.open=false;toast('Запись удалена')})
   }
   function confirmReset(){if(!isAdmin.value)return;confirmAction('Сбросить все данные?','Все локальные правки, оценки, журнал аудита и новые записи будут заменены исходным тестовым набором.',()=>{const fresh=createSeed();Object.keys(fresh).forEach(k=>db[k]=fresh[k]);confirmation.open=false;page.value='dashboard';audit('RESET','system','Демоданные сброшены');toast('Набор данных восстановлен')})}
   function exportBackup(){if(!isAdmin.value)return;downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'}),'TOU_backup_'+todayISO+'.json');audit('EXPORT','json','Выгружена резервная копия');toast('Резервная копия скачана')}
   function validateBackup(x){if(!x||x.version!==DEMO_CONTRACT.version||!MODELS.every(k=>Array.isArray(x[k]))||!Array.isArray(x.audit))return 'Версия или структура JSON не соответствует контракту.';
    for(const kind of MODELS){const ids=x[kind].map(v=>v?.id);if(ids.some(id=>typeof id!=='string'||!id)||new Set(ids).size!==ids.length)return `Некорректные ID в ${kind}.`}
    if(!x.users.some(u=>u.id===currentUser.value?.id&&u.role==='ADMIN'))return 'Резервная копия должна сохранять активную учётную запись администратора.';
    if(x.students.some(s=>!x.groups.some(g=>g.id===s.groupId)))return 'Есть студенты со ссылкой на отсутствующую группу.';
    if(x.lessons.some(l=>!x.groups.some(g=>g.id===l.groupId)||!x.subjects.some(s=>s.id===l.subjectId)||!x.teachers.some(t=>t.id===l.teacherId)||!x.rooms.some(r=>r.id===l.roomId)||!x.semesters.some(s=>s.id===l.semesterId)))return 'Нарушены связи расписания.';
    if(x.grades.some(g=>!x.students.some(s=>s.id===g.studentId)||!x.lessons.some(l=>l.id===g.lessonId)||!Number.isInteger(g.value)||g.value<0||g.value>100))return 'Некорректны связи или значения оценок.';
    if(x.attendance.some(a=>!x.students.some(s=>s.id===a.studentId)||!x.lessons.some(l=>l.id===a.lessonId)||!STATUS_NAMES[a.status]))return 'Некорректны связи посещаемости.';
    return null
   }
   async function importBackup(event){const file=event.target.files?.[0];event.target.value='';if(!file||!isAdmin.value)return;try{if(file.size>3_000_000)throw Error('JSON-файл слишком большой (максимум 3 МБ)');const data=JSON.parse(await file.text());const err=validateBackup(data);if(err)throw Error(err);Object.keys(data).forEach(k=>db[k]=data[k]);audit('IMPORT','json',`Импорт данных: ${file.name}`);toast('Данные импортированы') }catch(e){toast('Импорт не выполнен: '+e.message,'error')}}

   function runTests(){const results=[],check=(title,fn)=>{try{const ok=fn();if(ok!==true)throw Error(ok===false?'Условие не выполнено':String(ok));results.push({title,ok:true,error:''})}catch(e){results.push({title,ok:false,error:e?.message||'Ошибка'})}};
    const fixture={id:'L',date:'2026-10-01',start:'09:00',end:'10:30',teacherId:'T1',roomId:'R1',groupId:'G1'};
    const clash=patch=>detectConflict({...fixture,id:'L2',...patch},[fixture],'L2');
    const one=db.lessons[0],anyGroup=db.groups[0],anyStudent=db.students[0],anyGrade=db.grades[0],anyAttendance=db.attendance[0];
    check('01 · Контракт описывает десять обязательных сущностей',()=>MODELS.length===10);
    check('02 · Все десять массивов присутствуют в локальной модели',()=>MODELS.every(k=>Array.isArray(db[k])));
    check('03 · Первичные ключи уникальны внутри каждой сущности',()=>MODELS.every(k=>new Set(db[k].map(r=>r.id)).size===db[k].length));
    check('04 · Учётные записи имеют допустимые роли',()=>db.users.every(u=>!!ROLE_NAMES[u.role]));
    check('05 · Администратор имеет тестовую учётную запись',()=>db.users.some(u=>u.role==='ADMIN'));
    check('06 · Студент привязан к существующей группе (FK)',()=>db.students.every(s=>db.groups.some(g=>g.id===s.groupId)));
    check('07 · Куратор группы существует (FK)',()=>db.groups.every(g=>db.teachers.some(t=>t.id===g.curatorId)));
    check('08 · Связи Teacher — Subject принадлежат модели (N:M)',()=>db.teachers.every(t=>t.subjectIds.every(id=>db.subjects.some(s=>s.id===id))));
    check('09 · Связи Group — Subject принадлежат модели (N:M)',()=>db.groups.every(g=>g.subjectIds.every(id=>db.subjects.some(s=>s.id===id))));
    check('10 · Занятия имеют существующую группу и аудиторию',()=>db.lessons.every(l=>db.groups.some(g=>g.id===l.groupId)&&db.rooms.some(r=>r.id===l.roomId)));
    check('11 · Преподаватель указанной дисциплины назначен корректно',()=>db.lessons.every(l=>db.teachers.find(t=>t.id===l.teacherId)?.subjectIds.includes(l.subjectId)));
    check('12 · Дисциплина занятия присутствует в учебном плане группы',()=>db.lessons.every(l=>db.groups.find(g=>g.id===l.groupId)?.subjectIds.includes(l.subjectId)));
    check('13 · Дата каждого занятия внутри семестра',()=>db.lessons.every(l=>{const s=db.semesters.find(x=>x.id===l.semesterId);return s&&l.date>=s.start&&l.date<=s.end}));
    check('14 · Длительность каждого занятия строго положительна',()=>db.lessons.every(l=>l.start<l.end));
    check('15 · Вместимость аудитории не меньше состава группы',()=>db.lessons.every(l=>db.students.filter(s=>s.groupId===l.groupId).length<=(db.rooms.find(r=>r.id===l.roomId)?.capacity||0)));
    check('16 · Пересечение по преподавателю обнаруживается',()=>!!clash({roomId:'R2',groupId:'G2'}));
    check('17 · Пересечение по аудитории обнаруживается',()=>!!clash({teacherId:'T2',groupId:'G2'}));
    check('18 · Пересечение по учебной группе обнаруживается',()=>!!clash({teacherId:'T2',roomId:'R2'}));
    check('19 · Соседние интервалы не считаются конфликтом',()=>!clash({start:'10:30',end:'12:00'}));
    check('20 · Разные даты исключают ложный конфликт',()=>!clash({date:'2026-10-02'}));
    check('21 · Независимые преподаватель/группа/аудитория без конфликта',()=>!clash({teacherId:'T2',roomId:'R2',groupId:'G2'}));
    check('22 · Само занятие исключается из поиска конфликта',()=>!detectConflict(fixture,[fixture],fixture.id));
    check('23 · Среднее 70, 80, 90 равняется 80',()=>mean([70,80,90])===80);
    check('24 · Для пустой выборки средняя оценка отсутствует',()=>mean([])===null);
    check('25 · Все оценки целочисленные в пределах 0–100',()=>db.grades.every(g=>Number.isInteger(g.value)&&g.value>=0&&g.value<=100));
    check('26 · Оценка привязана к существующему студенту/занятию',()=>db.grades.every(g=>{const l=db.lessons.find(x=>x.id===g.lessonId);return l&&db.students.some(s=>s.id===g.studentId&&s.groupId===l.groupId)}));
    check('27 · Уникальна тройка студент + занятие + тип оценки',()=>{const keys=db.grades.map(g=>[g.studentId,g.lessonId,g.type].join('|'));return keys.length===new Set(keys).size});
    check('28 · Все статусы посещаемости допустимы',()=>db.attendance.every(a=>!!STATUS_NAMES[a.status]));
    check('29 · Посещаемость привязана к студенту своей группы',()=>db.attendance.every(a=>{const l=db.lessons.find(x=>x.id===a.lessonId);return l&&db.students.some(s=>s.id===a.studentId&&s.groupId===l.groupId)}));
    check('30 · Посещаемость уникальна по студенту и занятию',()=>{const keys=db.attendance.map(a=>a.studentId+'|'+a.lessonId);return new Set(keys).size===keys.length});
    check('31 · Отрицательная оценка отвергается валидацией',()=>!!validateEntity('grades',{studentId:anyGrade.studentId,lessonId:anyGrade.lessonId,type:'Итоговая',value:-1},null));
    check('32 · Оценка свыше 100 отвергается валидацией',()=>!!validateEntity('grades',{studentId:anyGrade.studentId,lessonId:anyGrade.lessonId,type:'Итоговая',value:101},null));
    check('33 · Дублирующийся номер студента отвергается',()=>!!validateEntity('students',{...anyStudent,id:'other'},'other'));
    check('34 · Отрицательная вместимость аудитории отвергается',()=>!!validateEntity('rooms',{name:'R-TEST',building:'TEST',capacity:-1},null));
    check('35 · Удаление студента с оценками заблокировано',()=>db.grades.length>0&&!!deleteBlocker('students',anyGrade.studentId));
    check('36 · Удаление занятия с посещаемостью заблокировано',()=>db.attendance.length>0&&!!deleteBlocker('lessons',anyAttendance.lessonId));
    check('37 · Удаление группы с участниками заблокировано',()=>!!deleteBlocker('groups',anyGroup.id));
    check('38 · Ролевые выборки оценок ограничены владельцем',()=>{const uid='st1';return db.grades.filter(g=>g.studentId===uid).every(g=>g.studentId===uid)});
    check('39 · Списки занятий преподавателя фильтруются по teacherId',()=>db.lessons.filter(l=>l.teacherId==='t1').every(l=>l.teacherId==='t1'));
    check('40 · Привязка роли STUDENT ведёт на Student',()=>db.users.filter(u=>u.role==='STUDENT').every(u=>db.students.some(s=>s.id===u.entityId)));
    check('41 · Привязка роли TEACHER ведёт на Teacher',()=>db.users.filter(u=>u.role==='TEACHER').every(u=>db.teachers.some(t=>t.id===u.entityId)));
    check('42 · Имена и кодировки пригодны для выгрузки XML',()=>escXML('<&"')==='&lt;&amp;&quot;');
    check('43 · XLSX экспорт упакован в ZIP Office Open XML',()=>buildXlsx([['Студент','Баллы'],['Тест',85]]).size>1000);
    check('44 · DOCX экспорт упакован в ZIP Office Open XML',()=>buildDocx({heading:'Тест',lines:['Проверка'],tableRows:[['A','B']]}).size>1000);
    check('45 · Формула посещаемости корректна (present+late)',()=>{const arr=['present','late','absent','excused'];return Math.round(arr.filter(x=>x==='present'||x==='late').length/arr.length*100)===50});
    testResults.value=results;toast(`Проверок: ${results.length} · успешно: ${results.filter(t=>t.ok).length}`,results.every(t=>t.ok)?'success':'error');
   }
