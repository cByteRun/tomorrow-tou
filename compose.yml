services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tou
      POSTGRES_USER: tou
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tou-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tou -d tou"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/tou
      DB_USER: tou
      DB_PASSWORD: ${DB_PASSWORD:-tou-local}
      TZ: ${TZ:-Asia/Yekaterinburg}
      DEMO_SEED: ${DEMO_SEED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Tomorrow21!}
    ports: ["127.0.0.1:${API_PORT:-18080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["apilogs:/app/logs"]
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
  apilogs:
